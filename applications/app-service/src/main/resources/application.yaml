server:
  port: 8080
spring:
  webflux:
    base-path: "/ms/audio-management"
  application:
    name: "ms_audio_management"
  devtools:
    add-properties: false
    profiles:
      include: "${SPRING_PROFILES_ACTIVE}"
  h2:
    console:
      enabled: true
      path: "/h2"
adapter:
  aws:
    s3:
      storageBucketName: "mytranscribebucketexample"
      region: "us-east-1"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
aws:
  dynamodb:
    endpoint: "http://localhost:8000"
